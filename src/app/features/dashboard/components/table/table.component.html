<div class="p-2">
    <h3 class="text-lg font-semibold mb-2">Recent Messages</h3>

    @if (marketData?.length) {
        <table class="w-full border-collapse text-left">
            <thead class="border-b border-gray-300">
            <tr class="text-sm text-gray-600">
                <th class="pb-1 px-2">Symbol</th>
                <th class="pb-1 px-2">Price</th>
                <th class="pb-1 px-2">Time</th>
            </tr>
            </thead>
            <tbody>
                @for (m of marketData; track m.time) {
                    <tr class="even:bg-gray-50 hover:bg-gray-100 transition">
                        <td class="py-1 px-2 font-medium">{{ m.symbol }}</td>
                        <td class="py-1 px-2">{{ m.price | number: '1.2-2' }}</td>
                        <td class="py-1 px-2">{{ m.time | date: 'mediumTime' }}</td>
                    </tr>
                }
            </tbody>
        </table>
    } @else {
        <p class="text-gray-500 italic">No data yet.</p>
    }
</div>
