<div class="p-2">
    <h3 class="text-lg font-semibold mb-2">
        Price Over Time
        @if (marketData && marketData.length > 0) {
            <span class="text-sm font-normal text-gray-500">
        ({{ marketData.length }} points)
      </span>
        }
    </h3>

    <div class="w-full h-[400px] relative">
        <div #chartContainer class="w-full h-full"></div>

        @if (!marketData || marketData.length === 0) {
            <div class="absolute inset-0 border border-dashed border-gray-300 flex items-center justify-center bg-white bg-opacity-90">
                <p class="text-gray-500">No data yet. Waiting for market data...</p>
            </div>
        }
    </div>
</div>
