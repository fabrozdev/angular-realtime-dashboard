<div class="chart-wrapper">
  <h3>Price Over Time (last points)</h3>
  <div *ngIf="marketData?.length; else empty">
    <div
      style="
        height: 300px;
        border: 1px dashed #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      <!-- Placeholder visualization: simple sparkline made with unicode for demo purposes -->
      <div>{{ dataset.join(', ') }}</div>
    </div>
  </div>
  <ng-template #empty><p>No data yet.</p></ng-template>
</div>
